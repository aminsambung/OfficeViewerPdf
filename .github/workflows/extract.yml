name: Extract ZIP to Repo

on:
  push:
    paths:
      - 'OfficeViewerPDF.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip OfficeViewerPDF.zip
        run: |
          unzip -o OfficeViewerPDF.zip -d extracted_tmp
          # Gunakan cp -R agar bisa menggabungkan folder yang sudah ada (seperti .github)
          cp -R extracted_tmp/* ./
          # Salin file tersembunyi (seperti .gitignore) jika ada
          cp -R extracted_tmp/.* ./ 2>/dev/null || true
          # Hapus folder sementara
          rm -rf extracted_tmp

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-extract OfficeViewerPDF.zip" || echo "Tidak ada perubahan"
          git push
