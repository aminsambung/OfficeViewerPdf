name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tambahan: Memberi izin agar file gradlew bisa dieksekusi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # Diubah menjadi ./gradlew agar menggunakan versi Gradle dari proyek Anda
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfficeViewerPDF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
